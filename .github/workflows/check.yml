name: check
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Eval harness
        run: pnpm --filter @flightdeck/evals test
