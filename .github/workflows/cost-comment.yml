name: cost-comment
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
jobs:
  cost:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'cost-comment')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flightdeck/evals test
      - name: Comment eval cost note
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### Flightdeck CI cost note',
              '',
              'This repo is not a Flightdeck-opened PR, so `transcript_events.usd` is not on this branch.',
              'The eval harness passed (`@flightdeck/evals`). Flightdeck-opened PRs get a cost comment from the runner after `gh pr create`.',
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
